name: Polyglot Microservices CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # JOB 1: Node.js Order Service CI
  # ==========================================
  build-and-test-node:
    name: "Node.js (Order Service)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/order-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/order-service/package-lock.json

      - name: Install Dependencies (npm ci)
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Docker Image
        run: docker build -t order-service:ci .

  # ==========================================
  # JOB 2: Python Inventory Service CI
  # ==========================================
  build-and-test-python:
    name: "Python (Inventory Service)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inventory-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: services/inventory-service/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Tests
        run: pytest -v

      - name: Build Docker Image
        run: docker build -t inventory-service:ci .

  # ==========================================
  # JOB 3: Java Payment Service CI
  # ==========================================
  build-and-test-java:
    name: "Java Spring Boot (Payment Service)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Maven Tests & Package JAR
        run: mvn clean verify -B

      - name: Build Docker Image
        run: docker build -t payment-service:ci .

  # ==========================================
  # JOB 4: End-to-End Smoke Test
  # ==========================================
  e2e-integration-smoke-test:
    name: "E2E Integration & Smoke Test"
    runs-on: ubuntu-latest
    needs: [build-and-test-node, build-and-test-python, build-and-test-java]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start All Microservices via Docker Compose
        run: docker compose up -d --build --wait

      - name: Verify Health Check Endpoints
        run: |
          echo "Checking Node.js Health..."
          curl -f http://localhost:3000/health
          echo -e "\nChecking Python Health..."
          curl -f http://localhost:8000/health
          echo -e "\nChecking Java Health..."
          curl -f http://localhost:8083/health

      - name: Test End-to-End Order Creation Flow
        run: |
          echo -e "\nTriggering multi-service order creation..."
          RESPONSE=$(curl -s -X POST http://localhost:3000/orders \
            -H "Content-Type: application/json" \
            -d '{
              "itemId": "ITEM-101",
              "quantity": 2,
              "amount": 199.98,
              "customerId": "CUST-GITHUB-RUNNER"
            }')

          echo "Response: $RESPONSE"

          # Assert that the order succeeded and returned CONFIRMED
          echo "$RESPONSE" | grep -q '"status":"CONFIRMED"' || (echo "Order test failed!" && exit 1)
          echo "$RESPONSE" | grep -q '"paymentReceipt"' || (echo "Missing payment receipt!" && exit 1)
          echo "All microservices communicated successfully!"

      - name: Cleanup Containers
        if: always()
        run: docker compose down
